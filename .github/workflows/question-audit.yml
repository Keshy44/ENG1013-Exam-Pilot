name: Question bank correctness
on:
  push:
    paths:
      - 'index.html'
      - 'question-bank.js'
      - 'scripts/audit-questions.cjs'
      - '.github/workflows/question-audit.yml'
  workflow_dispatch:

jobs:
  verify-answer-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate generated questions against Python
        run: node scripts/audit-questions.cjs
